name: Deploy to GitHub Pages

on:
  push:
    branches: [main, previews]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r prompt _site/prompt
      - name: Include branch previews (if any)
        run: |
          if git fetch origin previews 2>/dev/null; then
            git worktree add /tmp/previews origin/previews
            [ -d /tmp/previews/preview ] && cp -r /tmp/previews/preview _site/preview || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
