name: Refresh dashboard data from Prowler API

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — weekly snapshot refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Refresh embedded data snapshot
        env:
          PROWLER_API_KEY: ${{ secrets.PROWLER_API_KEY }}
        run: python3 scripts/refresh_data.py --html index.html
      - name: Commit and push if changed
        run: |
          git config user.name "prowler-demo-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore: refresh data snapshot from Prowler API"
            git push
          else
            echo "No data changes."
          fi
